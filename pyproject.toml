[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supermemory-harness"
version = "2.3.0"
description = "Anti-Amnesia Knowledge Graph, Self-Learning Constitutional Harness, Scientific Experiment Registry, and Lifecycle Extension for Antigravity & Multi-Agent Engineering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SuperMemory Engineering" }]
keywords = [
    "antigravity",
    "agent-harness",
    "knowledge-graph",
    "self-learning",
    "mcp",
    "experiment-tracking",
    "anti-regression",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
supermemory = "supermemory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supermemory = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 108
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
